<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="robots" content="noindex">
  <title>Cadastro | WKG Play</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap');
    :root{--orange:#ff6a00;--ink:#0b0b0e;--muted:#a7a7b1;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;background:radial-gradient(circle at 7% 7%,#513b0077,transparent 26%),radial-gradient(circle at 88% 90%,#3c2c0077,transparent 30%),var(--ink);font-family:'DM Sans',sans-serif}
    .shell{width:min(1120px,92vw);margin:auto;padding:27px 0 34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:block;position:relative;width:250px;height:64px;overflow:hidden}.brand img{position:absolute;width:275px;max-width:none;left:-23px;top:-108px;filter:invert(1);mix-blend-mode:screen}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}.badge i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46dd80;margin-right:6px}
    .card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:31px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));box-shadow:0 30px 70px #0006;padding:clamp(24px,5vw,52px)}.card:after{content:'';position:absolute;right:-75px;top:-110px;width:300px;height:300px;border:35px solid #ff6a0012;border-radius:50%;pointer-events:none}.eyebrow{position:relative;z-index:1;color:var(--orange);font-size:.7rem;letter-spacing:.18em;font-weight:700;margin:0 0 13px}.card h1{position:relative;z-index:1;font:800 clamp(2.1rem,5vw,4.2rem)/.94 'Syne';letter-spacing:-.08em;max-width:650px;margin:0 0 14px}.card h1 em{color:var(--orange);font-style:normal}.copy{position:relative;z-index:1;max-width:620px;color:var(--muted);line-height:1.55;margin:0 0 30px}.form-frame{position:relative;z-index:1;width:100%;height:790px;border:1px solid #ffffff19;border-radius:20px;background:#fff;overflow:hidden}.form-frame iframe{width:100%;height:100%;border:0}.note{text-align:center;margin:25px auto 0;color:#777780;font-size:.75rem}.note b{color:#c3c3ca}@media(max-width:620px){.top{margin-bottom:25px}.brand{width:190px}.badge{font-size:.6rem}.form-frame{height:850px;border-radius:15px}.card{padding:23px 17px}.card h1{font-size:2.55rem}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="/" aria-label="WKG Play"><img src="../wkg-play-logo.jpg" alt="WKG Play"></a><div class="badge"><i></i>Cadastro seguro</div></header>
    <section class="card">
      <p class="eyebrow">WKG PLAY</p>
      <h1>Vamos criar a rádio da sua <em>marca.</em></h1>
      <p class="copy">Preencha seus dados para iniciar seu cadastro. Nossa equipe entrará em contato para seguir com a ativação da sua rádio personalizada.</p>
      <div class="form-frame"><iframe title="Cadastro WKG Play" src="https://link.apisystem.tech/widget/form/XLSfwr57Av1KMxBqa22w" loading="eager" allow="clipboard-write"></iframe></div>
    </section>
    <p class="note">© 2026 Grupo WKG. Todos os direitos reservados.</p>
  </main>
</body>
</html>
