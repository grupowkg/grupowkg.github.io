<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rádio Rede Super Parque Pinheiro Machado | WKG Play</title>
  </head>
  <body>
    <script>
      window.__WKG_PLAYER_CONFIG = {
        clientKey: "rede-super-parque-pinheiro-machado",
        stationSlug: "rede_super_parque_pinheiro_machado",
        origin: "https://radios.wkgplay.com.br"
      };
      fetch('../', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('player-base');
        return response.text();
      }).then(page => {
        document.open();
        document.write(page.replace('<head>', '<head><base href="/">'));
        document.close();
      }).catch(() => {
        document.body.textContent = 'Player indisponível. Tente novamente mais tarde.';
      });
    </script>
  </body>
</html>
