<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rádio Teste Novo | WKG Play</title>
  </head>
  <body>
    <script>
      fetch('../').then(response => response.text()).then(page => {
        const stationSlug = "teste_novo";
        const enhancements =           '<style>' +
            '.brand{width:168px;height:48px}.brand img{width:185px;left:-15px;top:-72px}.art{background-size:cover;background-position:center;position:relative}.art::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(8,8,11,.08),rgba(8,8,11,.42))}.art .cover-fallback{position:relative;z-index:1;font:800 2rem Syne;color:#fff;text-shadow:0 2px 14px #000}' +
            '.request-trigger{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;border:1px solid #ff6a0088;border-radius:14px;background:#ff6a00;color:#111;font:800 .88rem/1 "DM Sans",sans-serif;padding:15px 18px;box-shadow:0 12px 28px #0006;cursor:pointer;transition:.2s}.request-trigger:hover{background:#ffac73;transform:translateY(-1px)}.request-trigger::before{content:"✦";font-size:1.05rem}.request-overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#000a}.request-dialog{width:min(520px,100%);border:1px solid #ffffff1e;border-radius:22px;background:#121217;color:#fff;box-shadow:0 30px 90px #000;padding:25px}.request-dialog h2{font:800 1.65rem/1 "Syne",sans-serif;margin:0 0 8px}.request-dialog p{margin:0 0 18px;color:#b5b5be;font:400 .86rem/1.45 "DM Sans",sans-serif}.request-dialog label{display:block;margin:13px 0 6px;color:#dddde4;font:700 .75rem/1 "DM Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase}.request-dialog input,.request-dialog select,.request-dialog textarea{width:100%;border:1px solid #ffffff20;border-radius:10px;background:#0a0a0d;color:#fff;padding:11px 12px;font:400 .92rem "DM Sans",sans-serif}.request-dialog textarea{min-height:100px;resize:vertical}.request-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:19px}.request-actions button{border:0;border-radius:10px;padding:12px 14px;font:800 .8rem "DM Sans",sans-serif;cursor:pointer}.request-cancel{background:#ffffff12;color:#fff}.request-submit{background:#ff6a00;color:#111}.request-note{margin-top:12px!important;font-size:.72rem!important;color:#858590!important}@media(max-width:470px){.request-dialog{padding:20px}}' +
          '</style><script>' +
            'const stationArt=document.querySelector(".art");stationArt.innerHTML="<span class=\\"cover-fallback\\">♫</span>";const stationStatus=document.querySelector("#status");const copyright="© "+new Date().getFullYear()+" Grupo WKG. Todos os direitos reservados.";const keepCopyright=()=>{if(stationStatus.textContent!==copyright)stationStatus.textContent=copyright};new MutationObserver(keepCopyright).observe(stationStatus,{childList:true,subtree:true,characterData:true});keepCopyright();fetch("https://radio.wkgplay.com.br/api/nowplaying/"+encodeURIComponent(stationSlug)).then(response=>response.json()).then(data=>{if(data.now_playing?.song?.art)stationArt.style.backgroundImage="url(\\""+data.now_playing.song.art+"\\")"}).catch(()=>{});const requestButton=document.createElement("button");requestButton.className="request-trigger";requestButton.type="button";requestButton.textContent="Solicitar ajuste";document.querySelector(".main").append(requestButton);const openRequest=()=>{const overlay=document.createElement("div");overlay.className="request-overlay";overlay.innerHTML=`<form class="request-dialog"><h2>Solicitar ajuste</h2><p>Pedido vinculado automaticamente à Rádio Teste Novo.</p><label>Tipo de solicitação</label><select name="type" required><option value="">Selecione</option><option>Alterar perfil musical</option><option>Inserir chamada ou aviso</option><option>Alterar horário ou frequência</option><option>Inserir anúncio ou parceiro</option><option>Problema técnico</option><option>Outro</option></select><label>Seu nome</label><input name="name" required maxlength="80" placeholder="Como podemos te chamar?"><label>WhatsApp para retorno</label><input name="phone" required maxlength="30" inputmode="tel" placeholder="(00) 00000-0000"><label>Detalhes do pedido</label><textarea name="details" required maxlength="1200" placeholder="Explique o que precisa ajustar."></textarea><div class="request-actions"><button type="button" class="request-cancel">Cancelar</button><button class="request-submit">Enviar solicitação</button></div><p class="request-note">O envio abre o WhatsApp com a solicitação estruturada. Nenhuma alteração é feita automaticamente na rádio.</p></form>`;document.body.append(overlay);const close=()=>overlay.remove();overlay.querySelector(".request-cancel").addEventListener("click",close);overlay.addEventListener("click",event=>{if(event.target===overlay)close()});overlay.querySelector("form").addEventListener("submit",event=>{event.preventDefault();const fields=new FormData(event.currentTarget);const message=["*Solicitação WKG Play*","Rádio: Teste Novo","Tipo: "+fields.get("type"),"Cliente: "+fields.get("name"),"WhatsApp: "+fields.get("phone"),"Detalhes: "+fields.get("details")].join("\\n");window.open("https://wa.me/5519992504157?text="+encodeURIComponent(message),"_blank","noopener");close()})};requestButton.addEventListener("click",openRequest);' +
          '</scr' + 'ipt>';
        document.open();
        document.write(page.replace('<head>', '<head><base href="/">').replace('</body>', enhancements + '</body>'));
        document.close();
      });
    </script>
  </body>
</html>
